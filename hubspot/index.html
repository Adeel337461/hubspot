<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>API Docs</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/notyf@3/notyf.min.css">


    <style>
        body {
            background: #0f172a;
            color: #fff;
        }
        html, body {
            height: 100%;
        }

        .container-fluid, .row {
            height: 100%;
        }
        .col-9 {
            height: 100%;
            overflow-y: auto;
        }
        .sidebar {
            border-top-left-radius: 10px;
            border-bottom-left-radius: 10px;
            height: 100vh;
            overflow-y: auto;
            background: #1e293b;
        }
        .endpoint {
            cursor: pointer;
            padding: 10px;
            border-bottom: 1px solid #334155;
        }
        .endpoint:hover {
            border-radius: 10px;
            background: #334155;
        }
        .method {
            font-weight: bold;
            margin-right: 10px;
        }
        .GET { color: #22c55e; }
        .POST { color: #3b82f6; }
        .PUT { color: #eab308; }
        .DELETE { color: #ef4444; }

        pre {
            background: #020617;
            padding: 15px;
            border-radius: 10px;
        }
        pre#response {
            max-height: 400px;
            overflow-y: auto;
            white-space: pre-wrap;
        }
        .sidebar-header {
            background: #334155;
            border-radius: 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container-fluid">
    <div class="row">

        <!-- Sidebar -->
        <div class="col-3 sidebar pt-4">
            <div class="sidebar-header text-center py-3 mb-2 mt-2">
                <h4>Hubspot API DOC</h4>
            </div>
            <div class="text-center">
                <button class="btn btn-warning mb-3" data-bs-toggle="modal" data-bs-target="#authModal">
                    Authenticate
                </button>
            </div>
            <div id="endpointList"></div>
        </div>

        <!-- Content -->
        <div class="col-9 p-4">

            <h3 id="title">Select API</h3>
            <p id="description"></p>

            <div class="mb-3">
                <label>Method</label>
                <select id="method" class="form-control">
                    <option>GET</option>
                    <option>POST</option>
                    <option>PUT</option>
                    <option>DELETE</option>
                </select>
            </div>

            <div class="mb-3">
                <label>URL</label>
                <input type="text" id="url" class="form-control">
            </div>

            <div class="mb-3">
                <label>Body (JSON)</label>
                <textarea id="body" class="form-control" rows="6"></textarea>
            </div>

            <button class="btn btn-success" onclick="sendRequest()">Send Request</button>

            <hr>

            <h5>Response</h5>
            <pre id="response">No response yet...</pre>

        </div>
    </div>
</div>
<div class="modal fade" id="authModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content text-dark">

      <div class="modal-header">
        <h5 class="modal-title">Enter Access Token</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">
        <input type="text" id="modalAccessToken" class="form-control" placeholder="Paste access token here">
      </div>

      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button class="btn btn-primary" onclick="saveToken()">Save</button>
      </div>

    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/notyf@3/notyf.min.js"></script>
<script>
    const notyf = new Notyf({
    duration: 3000,
    position: { x: 'right', y: 'top' },
    ripple: true,
    dismissible: true
});
const apiDocs = [
    {
        name: "Get Contact Fields",
        method: "POST",
        url: "https://traini.callhub.ai:8080/api/get-contact-required-fields",
        description: "Fetch all contact fields",
        body: {
            "access_token":"************",
        }
    },
    {
        name: "Create Contact Record",
        method: "POST",
        url: "https://traini.callhub.ai:8080/api/create-contact",
        description: "Create new Contact",
        body: {
            "access_token":"************",
            "email": "john.doe@example.com",
            "firstname": "John",
            "lastname": "Doe",
            "phone": "+1234567890",
            "company": "Example Company",
            "jobtitle": "Software Engineer",
            "website": "https://example.com",
            "city": "New York",
            "state": "NY",
            "zip": "10001",
            "country": "USA"
        }
    },
    {
        name: "Get Company Fields",
        method: "POST",
        url: "https://traini.callhub.ai:8080/api/get-company-required-fields",
        description: "Fetch all company fields",
        body: {
            "access_token":"************",
        }
    },
    {
        name: "Create Company Record",
        method: "POST",
        url: "https://traini.callhub.ai:8080/api/create-company",
        description: "Create new company record",
        body: {
            "access_token":"************",
            "name": "Acme Corporation",
            "domain": "acme.com",
            "phone": "+1-800-123-4567",
            "city": "San Francisco",
            "state": "California",
            "country": "USA",
            "numberofemployees": "100",
            "annualrevenue": "5000000",
            "website": "https://test.com",
            "description": "A leading provider of tech solutions"
        }
    }
];

function loadEndpoints() {
    const list = document.getElementById("endpointList");

    apiDocs.forEach((api, i) => {
        const div = document.createElement("div");
        div.className = "endpoint";

        div.innerHTML = `
            <span class="method ${api.method}">${api.method}</span>
            ${api.name}
        `;

        div.onclick = () => showEndpoint(i);
        list.appendChild(div);
    });
}

function showEndpoint(i) {
    document.getElementById('method').disabled = true;
    // Select the fields
    const methodField = document.getElementById("method");
    const urlField = document.getElementById("url");
    const bodyFieldReset = document.getElementById("body");
    const responseEl = document.getElementById("response");

    // Reset response and body whenever a field changes
    [methodField, urlField, bodyFieldReset].forEach(field => {
        field.addEventListener("input", () => {
            responseEl.innerText = "No response yet...";
        });
    });
    const api = apiDocs[i];

    document.getElementById("title").innerText = api.name;
    document.getElementById("description").innerText = api.description || "";

    const methodSelect = document.getElementById("method");
    methodSelect.value = api.method;

    const bodyField = document.getElementById("body");
    if (api.method === "GET" || api.method === "DELETE") {
        bodyField.value = "";
        bodyField.readOnly = true;
        bodyField.style.backgroundColor = "#2a2e3b";
    } else {
        let bodyData = api.body ? { ...api.body } : {};
        if (globalAccessToken && bodyData.hasOwnProperty("access_token")) {
            bodyData.access_token = globalAccessToken;
        }
        bodyField.value = JSON.stringify(bodyData, null, 2);
        bodyField.readOnly = false;
        bodyField.style.backgroundColor = "#fff";
    }

    document.getElementById("url").value = api.url;
}

function sendRequest() {
    const button = document.querySelector(".btn-success");
    const responseEl = document.getElementById("response");

    button.disabled = true;
    button.innerText = "Loading...";
    responseEl.innerText = "Loading...";

    const method = document.getElementById("method").value;
    const url = document.getElementById("url").value;
    const body = document.getElementById("body").value;

    let parsedBody = {};

    try {
        parsedBody = body ? JSON.parse(body) : {};
    } catch {
        notyf.error("Invalid JSON");
        button.disabled = false;
        button.innerText = "Send Request";
        return;
    }

    if (globalAccessToken && parsedBody.hasOwnProperty("access_token")) {
        parsedBody.access_token = globalAccessToken;
    }

    fetch(url, {
        method: method,
        headers: { "Content-Type": "application/json" },
        body: method !== "GET" ? JSON.stringify(parsedBody) : null
    })
    .then(res => res.text())
    .then(data => {
        try {
            responseEl.innerText = JSON.stringify(JSON.parse(data), null, 2);
        } catch {
            responseEl.innerText = data;
        }
    })
    .catch(err => {
        responseEl.innerText = err;
    })
    .finally(() => {
        button.disabled = false;
        button.innerText = "Send Request";
    });
}

loadEndpoints();
let globalAccessToken = "";

function saveToken() {
    const token = document.getElementById("modalAccessToken").value.trim();

    if (!token) {
        notyf.error("Token required!");
        return;
    }

    globalAccessToken = token;

    document.querySelector(".btn-warning").innerText = "Authenticated";
    const modal = bootstrap.Modal.getInstance(document.getElementById('authModal'));
    modal.hide();
    notyf.success("Token saved");


    updateBodyToken();
}
function updateBodyToken() {
    const bodyField = document.getElementById("body");

    try {
        let body = JSON.parse(bodyField.value || "{}");

        if (body.hasOwnProperty("access_token")) {
            body.access_token = globalAccessToken;
        }

        bodyField.value = JSON.stringify(body, null, 2);
    } catch {}
}
</script>

</body>
</html>
